- hv_crash:
    only Windows
    type = hv_crash
    not_preprocess = yes
    start_vm = no
    enable_pvpanic = no

    hv_crash_flag = hv_crash
    set_nmi_cmd = 'powershell -command "Set-ItemProperty -Path '
    set_nmi_cmd += "'HKLM:\SYSTEM\CurrentControlSet\Control\CrashControl' "
    set_nmi_cmd += '-Name NMICrashDump -Value 1 -Type DWord"'
