- cyg_install:
    only Windows
    type = cyginstall
    cdrom_check = powershell -command "Get-CimInstance Win32_CDROMDrive | Where-Object {$_.MediaLoaded} | ForEach-Object {$_.Drive}"
    cdrom_filter = "(\w):"
    cygwin_install_cmd = cmd /c WINUTILS:\netperf\cygwin.exe
    cygwin_start = C:\rhcygwin\Cygwin.bat -i /Cygwin-Terminal.ico -
