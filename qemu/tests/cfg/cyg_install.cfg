- cyg_install:
    only Windows
    type = cyginstall
    cdrom_check = powershell -command "Get-CimInstance Win32_CDROMDrive | Format-Table Id,MediaLoaded -AutoSize"
    cdrom_filter = "(\w+):\s+TRUE"
    cygwin_install_cmd = cmd /c WINUTILS:\netperf\cygwin.exe
    cygwin_start = C:\rhcygwin\Cygwin.bat -i /Cygwin-Terminal.ico -
